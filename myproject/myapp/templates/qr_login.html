{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>QR Code Login</h4>
            </div>
            <div class="card-body p-4">
                <button id="qr-scanner-btn" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-qr-code-scan"></i> Scan QR Code
                </button>
                
                <video id="qr-video" width="100%" class="mb-3 d-none"></video>
                
                <form method="post" action="{% url 'process_qr_login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="user_id" class="form-label">User ID</label>
                        <input type="text" class="form-control" id="user_id" name="user_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="pin" class="form-label">PIN</label>
                        <input type="password" class="form-control" id="pin" name="pin" maxlength="4" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="{% static 'js/qr_scanner.js' %}"></script>
{% endblock %}
{% endblock %}
