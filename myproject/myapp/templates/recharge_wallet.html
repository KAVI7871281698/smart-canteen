{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Recharge Wallet - {{ user.username }}</h5>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <p class="mb-1"><strong>Current Balance:</strong></p>
                    <h4>₹{{ user.wallet_balance }}</h4>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="amount" class="form-label">Recharge Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" class="form-control" id="amount" name="amount" 
                                   min="1" step="1" required>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-wallet2"></i> Recharge Wallet
                        </button>
                        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
